# Проверки: то же, что перед пушем руками в чистой копии
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml зовёт эти же проверки перед сборкой образов
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: director
          POSTGRES_PASSWORD: director
          POSTGRES_DB: director
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U director"
          --health-interval 5s
          --health-retries 10
    env:
      # тесты сами создают рядом базу director_test
      DATABASE_URL: postgresql+psycopg://director:director@localhost:5432/director
      SECRET_KEY: ci
    defaults:
      run:
        working-directory: api
    steps:
      - name: Код
        uses: actions/checkout@v7
      - name: uv и кеш пакетов
        uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: api
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Зависимости
        run: uv sync --locked
      - name: Линтер
        run: uv run ruff check .
      - name: Формат
        run: uv run ruff format --check .
      - name: Границы модулей
        run: uv run lint-imports
      - name: Тесты
        run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Код
        uses: actions/checkout@v7
      - name: Node и кеш пакетов
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Линтер
        run: npm run lint
      - name: Формат
        run: npm run format:check
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      # после сборки: типы LayoutProps и PageProps генерирует next build
      - name: Типы
        run: npx tsc --noEmit

  install:
    name: install.sh
    runs-on: ubuntu-24.04
    steps:
      - name: Код
        uses: actions/checkout@v7
      # shellcheck уже стоит на раннере GitHub
      - name: Линтер
        run: shellcheck -x install.sh install.test.sh
      - name: Тесты install.sh
        # sudo: тесты меняют владельца папки, как установщик на сервере
        run: sudo bash install.test.sh
