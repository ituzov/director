# Подпись CLA: на первый PR человека бот просит один раз написать фразу из
# CLA.md, записывает подпись и ставит статус. Без подписи PR не мержим.
name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target работает с правами на запись в наш репо. Код из PR здесь
  # не выкачивается и не запускается: только чтение комментариев и статус
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Подпись CLA
    runs-on: ubuntu-24.04
    if: >-
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Проверить подпись
        # репозиторий бота в архиве с марта 2026: закреплён по коммиту v2.6.1,
        # чтобы код под нами никто не подменил
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ituzov/director/blob/main/CLA.md
          # подписи в своей ветке, а не в main: main можно защищать
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          allowlist: ituzov,dependabot[bot],renovate[bot]
