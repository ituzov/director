# Стек Директора на сервере: docker compose up -d, переменные из .env.
# Образы готовые из GHCR, собрать у себя: docker-compose.build.yml

# без предела docker копит логи, пока не кончится диск
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-api: &api
  <<: *logging
  image: ghcr.io/ituzov/director-api:${DIRECTOR_VERSION:?задай DIRECTOR_VERSION в .env}
  environment:
    DATABASE_URL: postgresql+psycopg://director:${POSTGRES_PASSWORD}@db:5432/director
    SECRET_KEY: ${SECRET_KEY:?задай SECRET_KEY в .env}
    SETUP_TOKEN: ${SETUP_TOKEN:-}
    PUBLIC_URL: https://${DIRECTOR_HOST:?задай DIRECTOR_HOST в .env}
    LOG_JSON: "true"
    # rc только на тестовых серверах: им предлагаются и пре-релизы
    DIRECTOR_CHANNEL: ${DIRECTOR_CHANNEL:-stable}

services:
  db:
    <<: *logging
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: director
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: director
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director -d director"]
      interval: 5s
      retries: 10

  # одноразовый: применил миграции и завершился
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *api
    restart: unless-stopped
    # кнопка «Обновить»: просьба в request/, статус и лог в run/ (только чтение)
    volumes:
      - ./request:/director/request
      - ./run:/director/run:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    # по нему апдейтер поймёт, что новая версия поднялась
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 6

  worker:
    <<: *api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *logging
    image: ghcr.io/ituzov/director-web:${DIRECTOR_VERSION}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      retries: 6

  # единственный, кто смотрит наружу
  caddy:
    <<: *logging
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DIRECTOR_HOST: ${DIRECTOR_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # сертификаты: без тома каждый перезапуск упирался бы в лимиты Let's Encrypt
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]

volumes:
  db-data:
  caddy-data:
  caddy-config:
